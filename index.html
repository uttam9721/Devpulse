<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevPulse — Developer productivity & engineering analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F8;--surface:#FFFFFF;--surface-2:#F6F8FC;--ink:#0E1A2E;--ink-2:#47566F;--ink-3:#6B7890;
  --line:#E1E6EF;--line-2:#CFD7E4;--accent:#E5334F;--on-accent:#FFFFFF;
  --c-commit:#3563E9;--c-pr:#8B5CF6;--c-review:#0F9F8F;--c-issue:#E89A0C;
  --good:#0B8A7B;--bad:#D62A48;--warn:#A86A00;--shadow:0 14px 40px rgba(14,26,46,.16);--r:14px;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424;--surface:#101D33;--surface-2:#15253E;--ink:#E8EEF8;--ink-2:#A8B5CA;--ink-3:#8494AE;
    --line:#1F3050;--line-2:#2B4064;--accent:#FF5878;--on-accent:#1A0710;
    --c-commit:#6C93FF;--c-pr:#A98BFF;--c-review:#2CC7B5;--c-issue:#F5B33D;
    --good:#2CC7B5;--bad:#FF6B86;--warn:#F5B33D;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424;--surface:#101D33;--surface-2:#15253E;--ink:#E8EEF8;--ink-2:#A8B5CA;--ink-3:#8494AE;
  --line:#1F3050;--line-2:#2B4064;--accent:#FF5878;--on-accent:#1A0710;
  --c-commit:#6C93FF;--c-pr:#A98BFF;--c-review:#2CC7B5;--c-issue:#F5B33D;
  --good:#2CC7B5;--bad:#FF6B86;--warn:#F5B33D;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--fd);margin:0;letter-spacing:-.015em;line-height:1.12;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0}
b{font-weight:700}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}.tiny-t{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.tiny{width:13px;height:13px;stroke-width:2.2}
svg.i.big{width:22px;height:22px}
.gh{flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.93);background:var(--accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.dark:hover{background:var(--ink);filter:brightness(1.15)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:38px;padding:0}
.btn.icon.sm{width:32px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,26,46,.18)}
.input,.select,textarea.input{height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;width:100%}
.select{width:auto;max-width:100%;padding-right:8px}
textarea.input{height:auto;padding:12px;line-height:1.55;resize:vertical;font-size:14px}
.input::placeholder{color:var(--ink-3)}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
label.f .input{margin-top:6px;font-weight:400}
.err{color:var(--bad);font-size:12.5px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
button.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.merged{color:var(--c-pr);border-color:color-mix(in srgb,var(--c-pr) 35%,var(--line));background:color-mix(in srgb,var(--c-pr) 10%,transparent)}
.badge.open,.badge.approved,.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line));background:color-mix(in srgb,var(--good) 10%,transparent)}
.badge.closed,.badge.changes,.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:color-mix(in srgb,var(--bad) 9%,transparent)}
.badge.commented,.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 10%,transparent)}
.badge.pro{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sw{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;font-family:var(--fb)}
.av.lg{width:64px;height:64px;font-size:22px}.av.md{width:36px;height:36px;font-size:13px}.av.sm{width:22px;height:22px;font-size:9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.sep{height:1px;background:var(--line);margin:14px 0;border:0}

/* app shell */
.app{display:flex;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:240px;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:-.03em;padding:2px 8px 16px}
.nav h5{margin:16px 8px 6px;font:500 12px var(--fb);color:var(--ink-3)}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;padding-top:14px}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.main{margin-left:240px;flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;gap:8px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top .grow{flex:1}
.searchbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;min-width:min(340px,40vw);border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink-3);font-size:14px}
.searchbtn kbd{margin-left:auto;font:500 11px var(--fb);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--ink-3)}
.syncpill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.syncpill:hover{background:var(--surface-2)}
.syncpill .live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:beat 2.4s infinite}
.syncpill.busy .live{background:var(--c-issue);animation:none}
.syncpill.busy svg{animation:spin 1s linear infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
.content{padding:8px 28px 56px;max-width:1240px}
.pop{position:absolute;right:0;top:46px;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:50;overflow:hidden}
.pop .pi{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.pop .pi:last-child{border-bottom:0}
.pop .pi.unread{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pop .ph2{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-family:var(--fd)}
.pop.menu{width:220px;padding:6px}
.pop.menu button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left}
.pop.menu button:hover{background:var(--surface-2)}
.rel{position:relative}
.badge-dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-3);padding:6px 0;border-radius:10px}
.bnav button[aria-current="page"]{color:var(--accent)}

/* page structure */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 20px}
.phead h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.03em}
.phead .sub{color:var(--ink-2);margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g21{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g22{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h3{font-size:17px}
.ph .pr,.phead .pr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--surface);padding:16px 18px;min-width:0}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.kpi .val{font-size:34px;font-weight:700;margin-top:8px;line-height:1}
.kpi .val small{font-size:15px;font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:8px;min-height:28px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.delta.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.delta.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c-commit) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c-commit) 22%,var(--line));font-size:13.5px;color:var(--ink-2)}
.note svg{color:var(--c-commit);margin-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--fd);font-size:17px;margin-bottom:4px}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax text{fill:var(--ink-3);font-size:11px;font-family:var(--fb)}
.chart .guide{stroke:var(--line-2);stroke-width:1;opacity:0}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .12s;min-width:120px;box-shadow:var(--shadow)}
#tip div{display:flex;align-items:center;gap:6px;margin-top:3px}
#tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
#tip div b{margin-left:auto;padding-left:10px}
.legend{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0;flex:1}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut .dc{font:700 22px var(--fd);fill:var(--ink)}
.donut .ds{font:400 11px var(--fb);fill:var(--ink-3)}
.vbars{display:flex;align-items:stretch;gap:8px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vbar .track{flex:1;width:100%;display:flex;align-items:flex-end}
.vbar .b{width:100%;border-radius:7px 7px 3px 3px;background:var(--c-commit);transition:height .5s cubic-bezier(.2,.8,.2,1)}
.vbar.hi .b{background:var(--accent)}
.vbar .v{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vbar .l{font-size:12px;color:var(--ink-2);white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(76px,150px) 1fr auto;align-items:center;gap:12px;font-size:13.5px;padding:6px 0}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hb .tr{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb .fl{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hb .hv{color:var(--ink-2);font-size:13px;min-width:38px;text-align:right}
.lg-tog{display:flex;flex-wrap:wrap;gap:6px}
.lg-tog button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line-2);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.lg-tog button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.lg-tog i{width:8px;height:8px;border-radius:50%}

/* lists, tables, feed */
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--ink-3);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .t1{font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .t2{font-size:12.5px;color:var(--ink-3)}
.tbl td.r,.tbl th.r{text-align:right}
.add{color:var(--good)}.del{color:var(--bad)}
.feed{list-style:none}
.feed li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed .fi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.feed .ft{color:var(--ink-3);font-size:12.5px;white-space:nowrap;margin-left:auto;padding-left:8px}
.feed .repo{font-weight:500;color:var(--ink-2)}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;width:100%;text-align:left}
.att:last-child{border-bottom:0}
.att .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.att:hover .ai{background:var(--ink);color:var(--bg)}
.ai-card{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 55%);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.ai-body{font-size:14.5px;line-height:1.6}
.ai-body ol,.ai-body ul{padding-left:20px;margin:6px 0}
.ai-body p+p{margin-top:8px}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.streak{display:flex;align-items:center;gap:14px}
.streak .flame{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-issue) 16%,transparent);color:var(--c-issue)}
.streak .flame svg{width:24px;height:24px;fill:currentColor;stroke:none}
.days14{display:flex;gap:5px;margin-top:14px}
.days14 i{flex:1;height:26px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.days14 i.on{background:var(--c-review);border-color:var(--c-review)}
.heatwrap{overflow-x:auto;padding-bottom:6px}
.heat,.heatmon{display:grid;gap:3px;grid-auto-columns:13px}

<script>
(function(){
'use strict';
/* =====================================================================
   DevPulse — core, icons, synthetic GitHub data, analytics engine
   All numbers below are generated locally from a seeded sample dataset.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const DAY=864e5,HOUR=36e5,MIN=6e4;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('dp:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dp:'+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.indexOf('dp:')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
};
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- seeded random ---------- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20260920);
const rand=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(R()*a.length)];
function wpick(items,w){let t=sum(w),r=R()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
function poisson(l){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L&&k<60);return k-1}
function lognorm(med,sig){const u=1-R(),v=R();return med*Math.exp(sig*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

/* ---------- time ---------- */
const NOW=Date.now();
const T0=(()=>{const d=new Date(NOW);d.setHours(0,0,0,0);return d.getTime()})();
const dayStart=k=>{const d=new Date(T0);d.setDate(d.getDate()-k);return d.getTime()};
const dayIdx=t=>Math.ceil((T0-t)/DAY)||0;
const fmtD=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtW=t=>new Date(t).toLocaleDateString('en-US',{weekday:'short'});
const fmtDW=t=>new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/MIN));if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'};
const fmtDur=h=>{if(!h||!isFinite(h))return '—';if(h<1)return Math.max(1,Math.round(h*60))+'m';if(h<24){const m=Math.round((h%1)*60);return Math.floor(h)+'h '+(m<10?'0':'')+m+'m'}const d=Math.floor(h/24);return d+'d '+Math.round(h%24)+'h'};
const fmtN=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?Math.round(v/1e3)+'k':v>=1e3?(v/1e3).toFixed(1).replace('.0','')+'k':(Math.round(v*10)/10).toString();
const pct=(a,b)=>b?Math.round((a-b)/b*100):(a?100:0);

/* ---------- icons ---------- */
const IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 repo:'<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/>',
 pr:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-3M14 4l-2 3 2 3"/>',

const DB={commits:[],prs:[],reviews:[],issues:[]};
const RV={};
const prCount={},isCount={};
function makePR(c){
  const nowT=Date.now(),age=(nowT-c.t)/DAY;
  const num=(prCount[c.repo]=(prCount[c.repo]||100)+ri(1,3));
  const revs=shuffle(USERS.filter(u=>u.id!==c.user)).slice(0,ri(1,3));
  const resp0=Math.max(.3,lognorm(5.5,.75));
  const p={id:c.repo+'#'+num,num,repo:c.repo,author:c.user,title:c.msg,type:typeOf(c.msg),theme:c.theme,created:c.t,state:'open',mergedAt:null,closedAt:null,add:Math.round(lognorm(120,1.1)),del:Math.round(lognorm(45,1.1)),firstReview:null,pending:[]};
  p.files=Math.max(1,Math.round((p.add+p.del)/45*(.5+R())));
  const openP=age<1?.55:age<4?.3:age<12?.08:age<20?.02:0;
  if(R()>=openP){
    if(R()<.88){const mt=c.t+(resp0+Math.max(1,lognorm(9,.7)))*HOUR;if(mt<=nowT){p.mergedAt=mt;p.state='merged'}}
    else{const ct=c.t+lognorm(30,.9)*HOUR;if(ct<=nowT){p.closedAt=ct;p.state='closed'}}
  }
  revs.forEach((u,i)=>{
    const rh=resp0*(1+i*.7*R()),at=c.t+rh*HOUR;
    if(at<=nowT){
      const st=wpick(['approved','commented','changes'],[58,27,15]);
      const rv={pr:p.id,repo:p.repo,author:p.author,reviewer:u.id,state:st,at,comments:st==='approved'?ri(0,3):ri(1,8),resp:rh,title:p.title,num:p.num};
      DB.reviews.push(rv);(RV[p.id]=RV[p.id]||[]).push(rv);
      if(!p.firstReview||at<p.firstReview)p.firstReview=at;
    }else p.pending.push(u.id);
  });
  if(p.state==='merged'){const rs=RV[p.id]||[];if(rs.length&&!rs.some(r=>r.state==='approved'))rs[rs.length-1].state='approved'}
  if(p.state!=='open')p.pending=[];
  DB.prs.push(p);return p;
}
function makeIssue(t){
  const repo=wpick(REPOS,[3,3,2.5,1.5,1.5,1,1]);
  const label=wpick(LABELS,[38,20,20,9,6,7]);
  const pr=wpick(['Low','Medium','High','Critical'],[25,45,22,8]);
  const asg=wpick(USERS,USERS.map(u=>u.aff[repo.i]));
  const med={Low:110,Medium:56,High:28,Critical:9}[pr];
  const rh=Math.max(.5,lognorm(med,.85));
  const num=(isCount[repo.id]=(isCount[repo.id]||40)+ri(1,3));
  const it={id:repo.id+'#'+num,num,repo:repo.id,author:pick(USERS).id,assignee:asg.id,title:pick(ISSUE_TITLES[label]),label,priority:pr,created:t,closed:null};
  const ct=t+rh*HOUR;
  if(ct<=Date.now()&&R()>.03)it.closed=ct;
  DB.issues.push(it);return it;
}
(function generate(){
  const wkNoise={},focus={};let cid=1;
  const hourNow=new Date(NOW).getHours();
  for(let d=179;d>=0;d--){
    const day0=dayStart(d),wd=new Date(day0).getDay(),wknd=wd===0||wd===6,wk=Math.floor(d/7);
    USERS.forEach(u=>{
      const key=u.id+wk;
      if(!wkNoise[key]){
        wkNoise[key]=.7+R()*.6;
        const pool=[];REPOS.forEach(r=>{if(u.aff[r.i]>=1)r.themes.forEach(t=>{if(pool.indexOf(t[0])<0)pool.push(t[0])})});
        focus[key]=shuffle(pool).slice(0,2);
      }
      let lam=(wknd?u.we:u.wk)*wkNoise[key]*(.8+.35*(1-d/180));
      if(u.id===ME&&d<7)lam*=1.18;
      if(d===0)lam*=Math.max(.35,hourNow/20);
      const n=poisson(lam);
      for(let k=0;k<n;k++){
        const repo=wpick(REPOS,u.aff);
        const fc=repo.themes.filter(t=>focus[key].indexOf(t[0])>=0);
        const th=(fc.length&&R()<.7)?fc[0][0]:wpick(repo.themes.map(t=>t[0]),repo.themes.map(t=>t[1]));
        const hr=clamp(14+(R()+R()+R()-1.5)*5,8,22);
        let t=day0+hr*HOUR;if(t>NOW)t=NOW-ri(2,300)*MIN;
        DB.commits.push({id:cid++,t,repo:repo.id,user:u.id,msg:pick(THEME_MSGS[th]),theme:th,add:Math.round(lognorm(38,1)),del:Math.round(lognorm(14,1))});
      }
    });
    const ni=poisson(wknd?.4:1.5);
    for(let k=0;k<ni;k++){let t=day0+clamp(11+(R()+R()-1)*6,8,21)*HOUR;if(t>NOW)t=NOW-ri(5,200)*MIN;makeIssue(t)}
  }
  DB.commits.sort((a,b)=>a.t-b.t);
  DB.commits.forEach(c=>{if(R()<.15)makePR(c)});
  DB.reviews.sort((a,b)=>a.at-b.at);
  DB.prs.sort((a,b)=>a.created-b.created);
})();

/* live activity simulation (used by "Sync now" and the live feed) */
function simulate(n){
  const out=[];
  for(let i=0;i<n;i++){
    const r=R(),now=Date.now();
    const newCommit=()=>{
      const u=wpick(USERS,USERS.map(x=>x.wk)),repo=wpick(REPOS,u.aff);
      const th=wpick(repo.themes.map(t=>t[0]),repo.themes.map(t=>t[1]));
      const c={id:DB.commits.length+1,t:now-ri(1,15)*MIN,repo:repo.id,user:u.id,msg:pick(THEME_MSGS[th]),theme:th,add:Math.round(lognorm(38,1)),del:Math.round(lognorm(14,1))};
      DB.commits.push(c);return {c,u,repo};
    };
    if(r<.55){const x=newCommit();out.push(`${x.u.first} pushed to ${x.repo.id}`)}
    else if(r<.7){const x=newCommit(),p=makePR(x.c);p.created=now-ri(1,10)*MIN;out.push(`${x.u.first} opened PR #${p.num} in ${p.repo}`)}
    else if(r<.85){
      const open=DB.prs.filter(p=>p.state==='open'&&p.pending.length);
      if(open.length){const p=pick(open),rid=p.pending.shift();const st=wpick(['approved','commented','changes'],[58,27,15]);
        const rv={pr:p.id,repo:p.repo,author:p.author,reviewer:rid,state:st,at:now-ri(1,5)*MIN,comments:st==='approved'?ri(0,3):ri(1,8),resp:Math.max(.3,(now-p.created)/HOUR),title:p.title,num:p.num};
        DB.reviews.push(rv);(RV[p.id]=RV[p.id]||[]).push(rv);if(!p.firstReview)p.firstReview=rv.at;
        out.push(`${U(rid).first} reviewed PR #${p.num} in ${p.repo}`)}
      else{const x=newCommit();out.push(`${x.u.first} pushed to ${x.repo.id}`)}
    }else{
      const open=DB.issues.filter(it=>!it.closed);
      if(open.length){const it=pick(open);it.closed=now-ri(1,8)*MIN;out.push(`${U(it.assignee).first} closed issue #${it.num} in ${it.repo}`)}
      else{const x=newCommit();out.push(`${x.u.first} pushed to ${x.repo.id}`)}
    }
  }
  return out;
}

  const scope=o.scope||state.scope;

  const repo=o.repo!==undefined?o.repo:state.repo;

  const okR=r=>o.all?true:(repo?r===repo:state.tracked.has(r));
  return {lo,hi,days:hi-lo,user,repo,inR,okR,
    commits:DB.commits.filter(c=>inR(c.t)&&okR(c.repo)&&(!user||c.user===user)),
    prs:DB.prs.filter(p=>inR(p.created)&&okR(p.repo)&&(!user||p.author===user)),
    mergedPrs:DB.prs.filter(p=>p.mergedAt&&inR(p.mergedAt)&&okR(p.repo)&&(!user||p.author===user)),
    reviews:DB.reviews.filter(r=>inR(r.at)&&okR(r.repo)&&(!user||r.reviewer===user)),

function bucketize(sl){

  const mk=()=>Array(nb).fill(0);
  const o={commits:mk(),prs:mk(),merged:mk(),reviews:mk(),issues:mk(),opened:mk(),labels:[],long:[],nb};
  const idx=t=>clamp(nb-1-Math.floor((dayIdx(t)-sl.lo)/step),0,nb-1);
  sl.commits.forEach(c=>o.commits[idx(c.t)]++);
  sl.prs.forEach(p=>o.prs[idx(p.created)]++);
  sl.mergedPrs.forEach(p=>o.merged[idx(p.mergedAt)]++);
  sl.reviews.forEach(r=>o.reviews[idx(r.at)]++);
  sl.issClosed.forEach(i=>o.issues[idx(i.closed)]++);
  sl.issOpened.forEach(i=>o.opened[idx(i.created)]++);
  for(let b=0;b<nb;b++){
    const dEnd=sl.lo+(nb-1-b)*step,dStart=Math.min(sl.hi-1,dEnd+step-1);

}

}

function activeDays(uid){

function drawLine(el,d){

function weeklyHTML(sl,v){

  const when=d===7?'this week':d===30?'this month':d===90?'this quarter':'in this period';
  const subj=me?'you':'the team',Subj=me?'You':'The team';
  const lead=[`${cap(when)} ${subj} worked mainly on:`,`${cap(when)}, most of ${me?'your':'the team’s'} effort went into:`,`Here is where ${subj} spent time ${when}:`][v%3];
  const list=s.th.map(t=>`<li>${esc(t.name)} <span class="faint">(${pl(t.count,'commit')})</span></li>`).join('');
  const end=[`${Subj} opened <b>${s.opened}</b> ${s.opened===1?'PR':'PRs'} and merged <b>${s.merged}</b>.`,`${Subj} merged <b>${s.merged}</b> ${s.merged===1?'PR':'PRs'} and gave <b>${s.reviews}</b> ${s.reviews===1?'review':'reviews'}.`,`${Subj} pushed <b>${s.commits}</b> commits, opened <b>${s.opened}</b> PRs and closed <b>${s.issues}</b> ${s.issues===1?'issue':'issues'}.`][v%3];
  return `<p>${lead}</p><ol>${list}</ol><p>${end}</p><p>The largest activity was in <b>${s.top.id}</b> (${Math.round(s.top.p*100)}% of commits).</p>`;
}

  if(pend.length)it.push({i:'eye',t:`${pl(pend.length,'pull request')} waiting for your review`,s:pend.slice(0,2).map(p=>`#${p.num} in ${p.repo}`).join(', '),to:'#/pull-requests'});
  const mine=DB.prs.filter(p=>p.author===ME&&p.state==='open'&&ok(p.repo));
  const ch=mine.filter(p=>(RV[p.id]||[]).some(r=>r.state==='changes'));
  if(ch.length)it.push({i:'alert',t:`${pl(ch.length,'of your PR')} ${ch.length===1?'has':'have'} requested changes`,s:ch.slice(0,2).map(p=>`#${p.num} in ${p.repo}`).join(', '),to:'#/pull-requests'});
  const stale=mine.filter(p=>dayIdx(p.created)>=3&&ch.indexOf(p)<0);

  const yc=DB.commits.filter(c=>c.user===ME&&dayIdx(c.t)===d&&ok(c.repo));
  const y=themesOf(yc,4).map(t=>t.name);
  const rv=DB.reviews.filter(r=>r.reviewer===ME&&dayIdx(r.at)===d&&ok(r.repo)).length;
  if(rv)y.push(`Reviewed ${pl(rv,'pull request')}`);

  const iss=DB.issues.filter(i=>!i.closed&&i.assignee===ME&&(i.priority==='High'||i.priority==='Critical')&&ok(i.repo));

    case 'aitoggle':state.ai[el.dataset.k]=chk;store.set('ai',state.ai);return false;
    case 'aitone':state.ai.tone=val;store.set('ai',state.ai);return false;
    case 'saveprofile':{const n=$('#pf-name').value.trim(),em=$('#pf-email').value.trim(),ro=$('#pf-role').value.trim();
      if(!n){toast('Name cannot be empty.','bad');return false}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Enter a valid email address.','bad');return false}
      state.profile={name:n,email:em,role:ro||'Developer'};store.set('profile',state.profile);USERS[0].name=n;USERS[0].first=n.split(' ')[0];USERS[0].role=state.profile.role;toast('Profile saved');return true}
    case 'revoke':toast('Session revoked');return false;
    case 'disconnect':confirmBox('Disconnect GitHub?','DevPulse will stop syncing and you will be signed out. Synced data stays until you delete your account.','Disconnect',()=>{state.auth=false;store.set('auth',false);go('#/')},true);return false;
    case 'logout':state.auth=false;store.set('auth',false);go('#/');return false;
    case 'deleteacct':confirmBox('Delete your account?','This removes synced data, reports and settings from DevPulse. This cannot be undone.','Delete account',()=>{store.clear();try{location.hash='';location.reload()}catch(e){state.auth=false;go('#/')}},true);return false;
    case 'setplan':
      if(v==='free'&&state.tracked.size>3){openModal({type:'keep',sel:new Set([...state.tracked].slice(0,3))});return false}
      state.plan=v;store.set('plan',v);if(v==='free'&&state.range===90)state.range=30;toast(`You are now on the ${cap(v)} plan (demo)`);return true;
    case 'keepsel':chk?state.modal.sel.add(v):state.modal.sel.delete(v);renderModal();return false;
    case 'keepconfirm':state.tracked=new Set(state.modal.sel);saveTracked();state.plan='free';store.set('plan','free');if(state.range===90)state.range=30;state.repo='';closeModal();toast('You are now on the Free plan (demo)');return true;
  }
  return false;
}
function runOnbSync(){
  let step=0;const iv=setInterval(()=>{
    step++;const o=state.onb;o.prog=o.prog.map((_,i)=>clamp((step-i*4)/14,0,1));
    if(parseRoute().page==='onboarding')renderApp();
    if(o.prog.every(p=>p>=1)){clearInterval(iv);o.done=true;if(parseRoute().page==='onboarding')renderApp()}
    if(parseRoute().page!=='onboarding'&&!o.done){clearInterval(iv)}
  },90);
}
function finishOnb(){
  state.tracked=new Set(state.onb.sel);if(!state.tracked.size)state.tracked=new Set(REPOS.map(r=>r.id));saveTracked();
  state.auth=true;store.set('auth',true);state.lastSync=Date.now();go('#/dashboard');toast('GitHub connected and synced');
}

/* ---------- events & boot ---------- */
function boot(){
  applyTheme();
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-a]');
    if(!el){if(state.pop&&!e.target.closest('.pop')){state.pop=null;renderApp()}return}
    if(/^(SELECT|INPUT|TEXTAREA)$/.test(el.tagName))return;
    if(state.pop&&!el.closest('.pop')&&el.dataset.a!=='notif'&&el.dataset.a!=='menu'){state.pop=null}
    if(act(el.dataset.a,el,e)!==false)renderApp();
  });
  document.addEventListener('change',e=>{
    const el=e.target;if(!el.dataset||!el.dataset.a)return;
    if(el.tagName==='SELECT'||(el.tagName==='INPUT'&&el.type==='checkbox')){if(act(el.dataset.a,el,e)!==false)renderApp()}
  });
  document.addEventListener('input',e=>{
    const el=e.target;if(!el.dataset||!el.dataset.a)return;
    if((el.tagName==='INPUT'&&el.type!=='checkbox')||el.tagName==='TEXTAREA'){if(act(el.dataset.a,el,e)!==false)renderApp()}
  });
  document.addEventListener('keydown',e=>{
    const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&state.auth){e.preventDefault();act('pal',t,e);return}
    if(e.key==='/'&&!typing&&state.auth&&!state.modal){e.preventDefault();act('pal',t,e);return}
    if(e.key==='Escape'){if(state.modal)closeModal();else if(state.pop){state.pop=null;renderApp()}return}
    if(state.modal&&state.modal.type==='pal'){
      const n=palItems().length;
      if(e.key==='ArrowDown'){e.preventDefault();state.ui.palI=(state.ui.palI+1)%Math.max(1,n);renderModal()}
      else if(e.key==='ArrowUp'){e.preventDefault();state.ui.palI=(state.ui.palI+n-1)%Math.max(1,n);renderModal()}
      else if(e.key==='Enter'){e.preventDefault();const it=palItems()[state.ui.palI];closeModal();if(it)it.fn()}
      return;
    }
    if(e.key==='Enter'){
      if(t.id==='chatq'){e.preventDefault();sendChat(t.value)}
      else if(t.id==='slackq'){e.preventDefault();sendSlack(t.value)}
      else if(t.id==='lg-email'||t.id==='lg-pass'){e.preventDefault();if(act('loginemail',t,e)!==false)renderApp()}
    }
  });
  window.addEventListener('hashchange',()=>{if(location.hash!==state.hash){state.hash=location.hash;renderApp()}});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(mountCharts,120)});
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')renderApp()})}catch(e){}
  setInterval(()=>{
    if(!state.auth||document.hidden||state.modal)return;
    const l=$('#syncl');if(l&&!state.syncing)l.textContent='Synced '+ago(state.lastSync);
    if(state.live&&parseRoute().page==='dashboard'&&Math.random()<.5){const ev=simulate(1);state.lastSync=Date.now();renderApp();toast(ev[0])}
  },28000);
  state.hash=location.hash||'';
  if(state.auth&&!state.hash)state.hash='#/dashboard';
  renderApp();
}
window.__DP.pages={PAGES,landing,login,onboarding,notifs,answer,standup,releaseNotes,reportData,palItems,parseRoute,state};
if(document.getElementById('app'))boot();
})();

</script>
